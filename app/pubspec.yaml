name: flood_rescuer
description: "Flood Rescue AI rescuer app (student project): offline map, route, priorities, field reports."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_map: ^8.3.2
  flutter_map_mbtiles: ^1.1.0
  latlong2: ^0.10.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
