# Exposure and priority (src/priority). Paths are under $DATA_ROOT.
experiment: priority
population:
  # WorldPop Nepal, 100 m, constrained. Check the current file name on https://hub.worldpop.org
  # (Nepal, "Constrained individual countries") and update this URL if it moved.
  url: https://data.worldpop.org/GIS/Population/Global_2000_2020_Constrained/2020/BSGM/NPL/npl_ppp_2020_constrained.tif
  path: nepal/worldpop/npl_ppp_2020_constrained.tif
admin:
  # Lowest level available: wards if you have a ward file (put it at `path`), otherwise
  # municipalities (local levels) from geoBoundaries ADM3, fetched through its API.
  path: nepal/admin/npl_local_levels.geojson
  geoboundaries_api: https://www.geoboundaries.org/api/current/gbOpen/NPL/ADM3/
  name_field: shapeName
facilities:
  path: nepal/osm/facilities.geojson    # OSM amenity=hospital|clinic + place=city|town
# (b) new water (post and not pre, minus JRC >= 50 %) from scripts/nepal_level1.py, so the normal
# river channel is not counted as exposed; (a) all water is S1_20240927_model_mask.tif
flood_mask: nepal/level1/S1_20240927_model_new_mask.tif
std: nepal/level1/S1_20240927_flood_std.tif
threshold: 0.5
method: majority            # or fraction (see src/priority/exposure.py)
vehicle: car
verify_below: 0.6
analysis_bbox: [86.9, 26.35, 87.35, 26.85]   # keep in step with configs/routing.yaml graph.bbox
# UNOSAT FL20240928NPL population exposure (WorldPop unconstrained UN-adjusted 2020, 100 m), total of
# Koshi and Madhesh inside the analysed area. Same date as flood_mask (27 Sep 2024): 17,317; for
# 1 Oct 2024 it is 17,794 (the "about 18,000" on the map). Credit: "Analysis: UNOSAT".
unosat_exposed_reference: 17317
outputs: nepal/priority
alert:
  river: Koshi
  district: Sunsari and Saptari
  shelter: the nearest school or health post on high ground
